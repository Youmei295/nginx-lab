# 03_rate_limit.conf — Demo 3: Rate Limiting trên limit.local (HTTP:80)
# Thông số chốt (docs/interfaces.md mục 6): rate=10r/s burst=20 nodelay

limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

server {
    listen 80;
    server_name limit.local;

    root /usr/share/nginx/html;
    index index.html;

    limit_req zone=perip burst=20 nodelay;
}
