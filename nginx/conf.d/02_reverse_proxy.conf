# ==============================================================================
# Cấu hình Virtual Host & Reverse Proxy cho app.local
# Lab CSC-11117 — Linux OS And Applications (Demo 2 & Demo 4)
# Tuân thủ: docs/interfaces.md mục 1, 3, 4, 5
# ==============================================================================

# 1. HTTP Server Block (Port 80): Chuyển hướng 301 sang HTTPS
server {
    listen 80;
    server_name app.local;

    # Chuyển hướng toàn bộ truy cập HTTP sang HTTPS tương ứng
    return 301 https://$host$request_uri;
}

# 2. HTTPS Server Block (Port 443): Reverse Proxy tới backend và SSL Termination
server {
    listen 443 ssl;
    server_name app.local;

    # Chứng chỉ SSL tự ký
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Giao thức TLS an toàn
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Trang lỗi tùy chỉnh cho backend down / timeout (Demo 4 & docs/interfaces.md mục 4)
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        alias /usr/share/nginx/error_pages/custom_50x.html;
        internal;
    }

    # Reverse proxy forward traffic sang backend Python
    location / {
        proxy_pass http://127.0.0.1:3000;

        # Truyền tải các header cần thiết để backend nhận diện thông tin client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình timeout kết nối upstream (mặc định hoặc tinh chỉnh hợp lý)
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
