<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dịch vụ tạm thời gián đoạn</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #edf4f2; }
    body {
      margin: 0;
      padding: 48px 24px 32px;
      color: #142c40;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }
    .page { max-width: 780px; margin: 0 auto; }
    .brand {
      margin: 0 0 28px;
      color: #27515a;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: .3px;
    }
    .brand-mark {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 10px;
      border: 4px solid #16766f;
      border-radius: 4px;
      vertical-align: -1px;
    }
    main {
      display: block;
      padding: 48px 56px;
      border: 1px solid #d5e2df;
      border-top: 5px solid #16766f;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 16px 48px rgba(20, 44, 64, .06);
    }
    .notice-icon {
      width: 56px;
      height: 56px;
      margin-bottom: 26px;
      border: 1px solid #f0d59b;
      border-radius: 16px;
      background: #fff5dd;
      color: #8a5200;
      font-size: 32px;
      font-weight: bold;
      line-height: 54px;
      text-align: center;
    }
    .status {
      display: inline-block;
      margin: 0 0 14px;
      padding: 4px 12px;
      border: 1px solid #f0d59b;
      border-radius: 20px;
      background: #fff9ec;
      color: #805000;
      font-size: 13px;
      font-weight: bold;
    }
    h1 {
      max-width: 600px;
      margin: 0 0 20px;
      font-size: 42px;
      line-height: 1.2;
      letter-spacing: -1px;
    }
    .description {
      max-width: 540px;
      margin: 0 0 28px;
      color: #506471;
      font-size: 18px;
      line-height: 1.7;
    }
    .retry {
      display: inline-block;
      min-width: 140px;
      min-height: 48px;
      padding: 11px 24px;
      border: 2px solid #126a63;
      border-radius: 8px;
      background: #126a63;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      line-height: 22px;
      text-align: center;
      text-decoration: none;
    }
    .retry:hover { border-color: #0d514c; background: #0d514c; }
    .retry:focus { outline: 3px solid #b6750e; outline-offset: 4px; }
    .hint {
      margin: 24px 0 0;
      padding-top: 22px;
      border-top: 1px solid #e5ecea;
      color: #506471;
      font-size: 14px;
    }
    footer {
      display: block;
      margin-top: 22px;
      color: #506471;
      font-size: 13px;
      text-align: center;
    }
    @media (max-width: 600px) {
      body { padding: 24px 16px; }
      .brand { margin-bottom: 20px; }
      main { padding: 30px 24px; border-radius: 12px; }
      .notice-icon { margin-bottom: 22px; }
      h1 { font-size: 32px; letter-spacing: -.5px; }
      .description { font-size: 16px; }
    }
    @media (max-width: 360px) {
      main { padding: 26px 20px; }
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <p class="brand"><span class="brand-mark" aria-hidden="true"></span>Dịch vụ trực tuyến</p>
    <main id="nginx-lab-error-page" aria-labelledby="page-title">
      <div class="notice-icon" aria-hidden="true">!</div>
      <p class="status">Tạm thời gián đoạn</p>
      <h1 id="page-title">Chúng tôi chưa thể hoàn tất yêu cầu.</h1>
      <p class="description">Dịch vụ hiện chưa thể phản hồi yêu cầu của bạn. Vui lòng chờ một lát rồi thử lại.</p>
      <a class="retry" href="/">Thử lại</a>
      <p class="hint">Nếu tình trạng này tiếp diễn, bạn có thể quay lại sau ít phút.</p>
    </main>
    <footer>Cảm ơn bạn đã kiên nhẫn.</footer>
  </div>
</body>
</html>
